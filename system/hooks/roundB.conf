# Round B switches (plan PHASE 3b.3). One line per piece: name=on|off. OFF = exactly the old behaviour.
# Read through system/hooks/lib/roundb.sh (bash) or system/hooks/lib/roundb.py (python), never by hand.
# For replay runs, the environment wins: ROUNDB_<NAME>=on|off (e.g. ROUNDB_BACK_DOOR=off).
back_door=on
own_list=on
placement_outside_homes=on
# Round C (plan PHASE 3b.4). cmdreader was removed in Round C (see the Round C record for its last sha).
fc_sheet_file_delete=on
fc_drive_bulk_delete=on
fc_shell_overwrite=on
fc_force_push=on
fc_private_push=on
# 2026-11-02 (Enver's ruling, push-scan middle ground; record <notes>/state/projects/v2/records/2026-11-02-push-scan-warn-mode.md): the MODE of fc_private_push, block|warn. block = the HARD STOP (unchanged). warn = the same scan runs on a public-remote push but the push is ALLOWED: the findings go to Claude at that step (additionalContext), one JSON line per finding goes to <notes>/state/push-warnings.log (cannot write it -> BLOCK), and the end-of-turn check holds the turn until Claude reports each one to the person. A scan that cannot run is a HARD STOP in both modes. No line / any other value = block. Env ROUNDB_FC_PRIVATE_PUSH_MODE wins. Read with roundb_val (lib/roundb.sh), never by hand.
fc_private_push_mode=warn
fc_plain_push_quiet=on
own_list_unhomed=on
placement_toolbox_hint=on
fc_canon_replace=on
# Round C practice: a confirm token the MODEL can type is not approval. ON = the Sheet guards ask the person (harness ask) instead of honouring LIFEHACK_SHEET_CONFIRM=1 in the command text; a reviewed scheduled job sets LIFEHACK_REVIEWED_JOB=1 in the launcher's environment instead.
fc_ask_not_token=on
fc_archive_before_cut=on
# Round C practice: the toolbox hint on the placement stop is picked by file name + opening (not 1500 chars of code), names the sanctioned tool first, and leads the message with 'reuse it'.
placement_hint_ranked=on
# 2026-11-02 (exam D-B06, student; plan fix 23(c)): ON = every build-mode stop names the ONE right route and never says retry: code outside the homes or in the notes folder -> <personal code>/tools/<name> plus the exact own_list_add command; notes in the harness -> the same path in the notes folder; a new skill/job/hook/desk -> read its SOP, then build. The stops themselves are unchanged: same triggers, still once per session, so no new block (a folder the person named lists with --keep). A write through a variable set in the same command (D=...; mv f "$D/a.py") is judged at its real path, and own_list_add accepts `--`. OFF = the old "Retry the same call" text and behaviour.
placement_route_sign=on
# Round C practice: a push to a folder on this same machine (bare repo / backup) draws no signpost - it cannot reach anyone.
fc_local_push_quiet=on
# Round C practice: an end-of-turn stop with two or more findings numbers them and says to do ALL (a session fixed the first and skipped the listing).
eot_do_all=on
# Round C practice: a skill or agent under a PROJECT folder's .claude/ (not ~/.claude) is the person's own code: it gets the placement stop and the own-list stop like any other tool.
placement_project_skills=on
email_reader_block=on
skill_edit_ask=on
# Round C post-exam (F04): ON = the shell-overwrite block on a CANON file tells the session the fine-china way through: show the person the diff and ASK; never wholesale-replace canon by any tool. Text only, no new block. OFF = the old 'use the Edit tool' text.
fc_canon_ask_text=on
# Round D (plan PHASE 3b.5). Fine china now also ASKS (never blocks) before: deleting a local database file or an obvious DROP/TRUNCATE (fc_db_delete_ask), rm -r of a whole non-throwaway folder (fc_folder_delete_ask), changing/deleting the person's OWN SOP (fc_user_sop_ask); and before ANY AI write to ~/.config/lifehack/placement.conf (fc_placement_conf_ask).
fc_db_delete_ask=on
# 2026-11-02 (D-F04, a whole person folder deleted after `cd notes && rm -r <folder>`): fc_folder_delete_ask now judges each command in the cwd its own cd chain left it in, and also reads rmdir, find -exec rm and python rmtree/removedirs/rmdir in executed -c / heredoc bodies. OFF = no folder-delete ask at all.
fc_folder_delete_ask=on
fc_user_sop_ask=on
fc_placement_conf_ask=on
# Round D A.2/B.1: personal skills live in ~/.claude/skills/<name>/ (Claude's own load path). ON = the own-list suggestion and the placement stop point there, a SKILL.md under <personal code>/skills/ gets a stop, and building a NEW skill in ~/.claude/skills does not trigger the skill_edit_ask.
skills_native_home=on
# Round D A.6: ON = the person can switch off a where-to-save check with `off<TAB><check>` in ~/.config/lifehack/placement.conf; from the 3rd repeat stop the message says how, with the warning. Fine-china guards never read that file.
placement_user_off=on
# Round D B.5: mode=watch -> every switched guard that is ON only LOGS what it would have done (~/.claude/run/watch/watch-log.jsonl) and blocks/asks nothing. mode=enforce (or no line) = normal. Env LIFEHACK_WATCH=1|0 overrides this line. Needs hooks.json to call the guards through lib/watch_run.sh (it does).
# Round D post-verdict (P-50): ON = a NEW file of a NEW personal skill under ~/.claude/skills/<name>/ may be written even with no git remote. Existing files, git repos, commands/ stay blocked.
skills_native_write=on
# Round D post-verdict: ON = a first local COMMIT is allowed when no ship identity file exists yet (nothing to publish as). Push path unchanged; a present file or unresolved brain root stays fail-closed.
commit_identity_optional=on
# GO-LIVE 2026-10-31: mode=enforce is real enforcement. ROLLBACK in one line: change it back to mode=watch (every ON switch then only logs).
mode=enforce
# 2026-10-31: ON = guard_hook_sop_read lets pure reads of system/hooks/ through: a quoted ">" (grep -c ">" f) is no longer taken for a redirect, and a sed "w" command into the hook plane is caught. OFF = old behaviour. Unparseable commands always keep the old behaviour.
hooksop_pure_reads=on
# 2026-10-31 (later-list, student-important): ON (and skill_edit_ask ON) = an AI edit of an EXISTING file in a NON-git personal skill under ~/.claude/skills is not hard-blocked by guard_write_paths; it goes to the skill-edit ASK (harness Yes/No). Git repos, the personal code folder, escaping symlinks, commands/ and system/hooks stay blocked. OFF = old behaviour (block).
skill_edit_to_ask=on
# 2026-11-01 (exam D-B03/D-B04): ON = the end-of-turn check also handles an INLINE Bash command with no file saved: person says keep it -> block once (save as script + own list); a long reusable inline command -> one offer-to-keep per session. OFF = today's behaviour.
inline_keep_nudge=on
# 2026-11-02 (exam D-B06: a Bash heredoc wrote a tool, the command returned exit 1, the end-of-turn check stayed silent): ON = turn_write_recorder also runs on PostToolUseFailure (failed Bash, failed Write/Edit/MultiEdit/NotebookEdit) and lists a target only if it changed since that command started, so a failed command that wrote nothing triggers nothing. OFF = old behaviour: a failure event records nothing.
record_failed_writes=on
# 2026-11-01 (Enver's ruling): OFF = guard_gh_account_switch allows every gh auth command (login/logout/refresh/switch),
# so either GitHub account can be used freely for now. ON = the guard as built (zone + owner repair switch). Code kept.
gh_switch_guard=off
# 2026-11-02 (D-F11, 899 Drive files trashed): ON = the shared gws parser (lib/gws_guard.py) reads the BODY of a heredoc / -c / -e that an interpreter EXECUTES (python3 - <<'EOF', node -e ...), a shell keyword before gws (do gws ...), and a shell string run by subprocess, so every gws guard sees a gws call inside it; a heredoc that only writes data (cat > f <<EOF) stays inert. OFF = old behaviour (every quoted heredoc body blanked).
gws_exec_heredoc=on
# 2026-11-02 (D-F11): ON = guard_cloud_destructive ASKS before a destructive cloud action (gcloud delete/rm, gsutil rm/rb, rclone delete/purge/move/sync, aws s3 rm, curl/wget DELETE to googleapis.com, gws permissions/emptyTrash/delete), in the command or in code it runs. OFF = does nothing.
fc_cloud_destructive_ask=on
# 2026-11-01 (plan PHASE 3b.8 item 5a): ON = a Write/Edit/MultiEdit or Bash write (redirect, append, tee, sed -i, cp/mv) onto an EXISTING file named CLAUDE.md is fine china: ask once, with a short diff. New CLAUDE.md files and reads never ask. 2026-11-02: a shell rm / unlink / mv-away of an EXISTING CLAUDE.md also asks (parity with the python delete); throwaway/temp paths never.
fc_claudemd_ask=on
# 2026-11-01 (5b): ON = the same write aimed at the plugin's own CLAUDE.md copy, on a machine that is not the maintainer's self-repo, asks with: it is replaced on the next update; put it in your own ~/.claude/CLAUDE.md.
fc_claudemd_plugin_copy=on
# 2026-11-01 (5c): ON = a Write/Edit/MultiEdit that leaves a CLAUDE.md over 200 lines (Claude Code docs: target under 200 per file) adds a non-blocking advisory line. Never asks, never blocks.
claudemd_len_advisory=on
# 2026-11-02 (direct-hook exam route-arounds D-F01/F08/F20): ON = fine china ASKS before python (an executed -c / heredoc / `-` body) deletes or moves away an existing fine-china FILE: os.remove, os.unlink, Path.unlink, os.rename/os.replace/shutil.move away. Fine-china file = a database, the person's SOP, a plugin SOP/canon file, a data file, a CLAUDE.md (the existing definitions). Temp/scratch/throwaway folders never ask. OFF = old behaviour (silent).
fc_python_delete_ask=on
# 2026-11-02 (D-F09/F13): ON = the same ask before python rewrites such a file: open(p,'w'), Path.write_text/write_bytes, os.truncate, or a replace/move/copy onto it. New files never ask. OFF = old behaviour.
fc_python_rewrite_ask=on
# 2026-11-02 (D-F12/F13): ON = fine china ASKS before a Write-tool full overwrite of an EXISTING data file (csv json yaml toml xlsx ...) or database, with a short diff. Edit never asks; new files never ask. OFF = old behaviour.
fc_write_overwrite_ask=on
# 2026-11-02 (coordinator ruling: same action, same verdict): ON (with fc_shell_overwrite ON) = a PYTHON overwrite (open(p,'w'), write_text, os.replace/shutil.move/copy onto, os.truncate, in an executed -c / heredoc body) of a plugin SOP or canon file is HARD-BLOCKED by guard_build_mode with the same message as the shell overwrite. The person's own SOPs and data files keep the fine-china ASK. OFF = python gets the ask only.
fc_python_canon_block=on
# 2026-11-02 (coordinator ruling (a), delete parity: same action, same verdict): ON = a shell rm / unlink / shred / trash, or mv of the file (a same-folder rename too), of an existing canon file, plugin SOP or fine-china data file ASKS, as the python delete does. Throwaway, temp and regenerable paths never ask. OFF = old behaviour (silent).
fc_shell_delete_ask=on
# 2026-11-02 (approved design <notes>/drafts/drive-skill-sharing-design.md, SIMPLE build): ON = the session-start check (team_skills.py --session-check, called from session_context_loader.sh) re-hashes every team-shared skill link and reports broken/missing links and changes that fail the re-scan (dropping the link, never touching the Drive copy). OFF = exactly today's behaviour: nothing runs, nothing prints. The tool itself is inert without the pointer files (~/.config/lifehack/team-sharing, team-skills). Env ROUNDB_TEAM_SKILL_VERIFY wins, as always.
team_skill_verify=off
# 2026-11-02 (exam D-B08/D-B09, plan fix 23(c)): ON = a prompt asking to get a skill to other people (lib/ups_triggers.py share) makes inject_sop_before_build.sh print the one route to the team Drive folder: shared/tools/team_skills.py discover, set team, share. It never blocks; the tool only acts when the session runs it. Goes beyond the SIMPLE build of the approved design, which left its prompt trigger out. OFF = exactly today's behaviour: nothing runs, nothing prints.
team_share_route=on
# 2026-11-02 (exam D-P06): ON = guard_no_upstream_commit_signpost never stops a commit: silent when the same command pushes that branch or the repo has no remote; otherwise one note to Claude per session/repo/branch (say it in the final message). OFF = the old deny on the first commit, passed by repeating it.
no_upstream_note=on
