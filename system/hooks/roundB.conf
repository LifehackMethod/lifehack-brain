# Round B switches (plan PHASE 3b.3). One line per piece: name=on|off. OFF = exactly the old behaviour.
# Read through system/hooks/lib/roundb.sh (bash) or system/hooks/lib/roundb.py (python), never by hand.
# For replay runs, the environment wins: ROUNDB_<NAME>=on|off (e.g. ROUNDB_BACK_DOOR=off).
back_door=on
own_list=on
placement_outside_homes=on
# Round C (plan PHASE 3b.4). cmdreader was removed in Round C (see the Round C record for its last sha).
reason_gate=off
remember_reason=off
allow_silence_reason=off
fc_sheet_file_delete=on
fc_drive_bulk_delete=on
fc_shell_overwrite=on
fc_force_push=on
fc_private_push=on
fc_plain_push_quiet=on
own_list_unhomed=on
placement_toolbox_hint=on
fc_canon_replace=on
# Round C practice: a confirm token the MODEL can type is not approval. ON = the Sheet guards ask the person (harness ask) instead of honouring LIFEHACK_SHEET_CONFIRM=1 in the command text; a reviewed scheduled job sets LIFEHACK_REVIEWED_JOB=1 in the launcher's environment instead.
fc_ask_not_token=on
fc_archive_before_cut=on
# Round C practice: the end-of-turn stop shows its 'Escapes' line only when a failure-hiding/copy/unwired finding is in it, never on a list-only stop.
eot_escape_scoped=off
# Round C practice: the toolbox hint on the placement stop is picked by file name + opening (not 1500 chars of code), names the sanctioned tool first, and leads the message with 'reuse it'.
placement_hint_ranked=on
# Round C practice: a push to a folder on this same machine (bare repo / backup) draws no signpost - it cannot reach anyone.
fc_local_push_quiet=on
# Round C practice: an end-of-turn stop with two or more findings numbers them and says to do ALL (a session fixed the first and skipped the listing).
eot_do_all=on
# Round C practice: a skill or agent under a PROJECT folder's .claude/ (not ~/.claude) is the person's own code: it gets the placement stop and the own-list stop like any other tool.
placement_project_skills=on
email_reader_block=on
skill_edit_ask=on
# Round C post-exam (F04): ON = the shell-overwrite block on a CANON file tells the session the fine-china way through: show the person the diff and ASK; never wholesale-replace canon by any tool. Text only, no new block. OFF = the old 'use the Edit tool' text.
fc_canon_ask_text=on
# Round C post-exam (B16): ON = an extensionless file whose first line is a shebang (#!) counts as CODE for the placement stops, the own-list check and the unhomed check, like a .sh/.py file. Extends existing checks; no new block.
code_shebang=off
# Round D (plan PHASE 3b.5). Fine china now also ASKS (never blocks) before: deleting a local database file or an obvious DROP/TRUNCATE (fc_db_delete_ask), rm -r of a whole non-throwaway folder (fc_folder_delete_ask), changing/deleting the person's OWN SOP (fc_user_sop_ask); and before ANY AI write to ~/.config/lifehack/placement.conf (fc_placement_conf_ask).
fc_db_delete_ask=on
fc_folder_delete_ask=on
fc_user_sop_ask=on
fc_placement_conf_ask=on
# Round D A.2/B.1: personal skills live in ~/.claude/skills/<name>/ (Claude's own load path). ON = the own-list suggestion and the placement stop point there, a SKILL.md under <personal code>/skills/ gets a stop, and building a NEW skill in ~/.claude/skills does not trigger the skill_edit_ask.
skills_native_home=on
# Round D A.6: ON = the person can switch off a where-to-save check with `off<TAB><check>` in ~/.config/lifehack/placement.conf; from the 3rd repeat stop the message says how, with the warning. Fine-china guards never read that file.
placement_user_off=on
# Round D B.5: mode=watch -> every switched guard that is ON only LOGS what it would have done (~/.claude/run/watch/watch-log.jsonl) and blocks/asks nothing. mode=enforce (or no line) = normal. Env LIFEHACK_WATCH=1|0 overrides this line. Needs hooks.json to call the guards through lib/watch_run.sh (it does).
# Round D post-verdict (P-50): ON = a NEW file of a NEW personal skill under ~/.claude/skills/<name>/ may be written even with no git remote. Existing files, git repos, commands/ stay blocked.
skills_native_write=on
# Round D post-verdict: ON = a first local COMMIT is allowed when no ship identity file exists yet (nothing to publish as). Push path unchanged; a present file or unresolved brain root stays fail-closed.
commit_identity_optional=on
# GO-LIVE 2026-10-31: mode=enforce is real enforcement. ROLLBACK in one line: change it back to mode=watch (every ON switch then only logs).
mode=enforce
# 2026-10-31: ON = guard_hook_sop_read lets pure reads of system/hooks/ through: a quoted ">" (grep -c ">" f) is no longer taken for a redirect, and a sed "w" command into the hook plane is caught. OFF = old behaviour. Unparseable commands always keep the old behaviour.
hooksop_pure_reads=on
# 2026-10-31 (PHASE 3b.6, B05 / P-51): ON = the end-of-turn check offers ONCE per session to keep a new one-off .py/.sh left in a throwaway spot (move to the personal code folder + own list). Never asks for a fix. OFF = nothing.
oneoff_script_nudge=off
# 2026-10-31 (later-list, student-important): ON (and skill_edit_ask ON) = an AI edit of an EXISTING file in a NON-git personal skill under ~/.claude/skills is not hard-blocked by guard_write_paths; it goes to the skill-edit ASK (harness Yes/No). Git repos, the ClaudeOps symlink, escaping symlinks, commands/ and system/hooks stay blocked. OFF = old behaviour (block).
skill_edit_to_ask=on
