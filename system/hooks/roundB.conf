# Round B switches (plan PHASE 3b.3). One line per piece: name=on|off. OFF = exactly the old behaviour.
# Read through system/hooks/lib/roundb.sh (bash) or system/hooks/lib/roundb.py (python), never by hand.
# For replay runs, the environment wins: ROUNDB_<NAME>=on|off (e.g. ROUNDB_BACK_DOOR=off).
back_door=off
own_list=off
placement_outside_homes=off
# Round C (plan PHASE 3b.4). cmdreader was removed in Round C (see the Round C record for its last sha).
reason_gate=off
remember_reason=off
allow_silence_reason=off
fc_sheet_file_delete=off
fc_drive_bulk_delete=off
fc_shell_overwrite=off
fc_force_push=off
fc_private_push=off
fc_plain_push_quiet=off
own_list_unhomed=off
placement_toolbox_hint=off
fc_canon_replace=off
# Round C practice: a confirm token the MODEL can type is not approval. ON = the Sheet guards ask the person (harness ask) instead of honouring LIFEHACK_SHEET_CONFIRM=1 in the command text; a reviewed scheduled job sets LIFEHACK_REVIEWED_JOB=1 in the launcher's environment instead.
fc_ask_not_token=off
fc_archive_before_cut=off
# Round C practice: the end-of-turn stop shows its 'Escapes' line only when a failure-hiding/copy/unwired finding is in it, never on a list-only stop.
eot_escape_scoped=off
# Round C practice: the toolbox hint on the placement stop is picked by file name + opening (not 1500 chars of code), names the sanctioned tool first, and leads the message with 'reuse it'.
placement_hint_ranked=off
# Round C practice: a push to a folder on this same machine (bare repo / backup) draws no signpost - it cannot reach anyone.
fc_local_push_quiet=off
# Round C practice: an end-of-turn stop with two or more findings numbers them and says to do ALL (a session fixed the first and skipped the listing).
eot_do_all=off
# Round C practice: a skill or agent under a PROJECT folder's .claude/ (not ~/.claude) is the person's own code: it gets the placement stop and the own-list stop like any other tool.
placement_project_skills=off
email_reader_block=off
skill_edit_ask=off
