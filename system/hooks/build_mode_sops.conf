# guard_build_mode.sh -- where each kind's rulebook lives. ONE line per kind, TAB-separated:
#   kind <TAB> sop path (relative to the harness code root) <TAB> optional read command ("" = just read the file)
# The rulebook sort renames files: when it does, edit the path HERE, not in the hook. A missing file
# is reported honestly in the message ("could not be found"), never a dead path presented as live.
# Kinds: skill job hook desk.  Lines starting with # are ignored.
skill	system/sops/skill-building-sop.md	
job	system/sops/jobs-sop.md	
hook	system/sops/hook-sop.md	bash $CODE/system/tools/read_sop.sh hook
desk	system/sops/desk-building-sop.md	
