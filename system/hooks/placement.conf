# guard_build_mode.sh, check 3 (placement): "where things belong". Small and lenient on purpose.
# A NEW file whose kind does not match where it is going gets a one-time speed bump (deny once per rule per
# session, the identical retry passes). Placement never hard-blocks. Data files jobs write (.json .jsonl
# .csv, logs) are not listed here, so they are always fine.
# Fields, TAB-separated:  name <TAB> zone <TAB> file patterns (comma list, fnmatch on the basename) <TAB> message
# zone:  notes                      anywhere under your notes folder (resolved through brain_root)
#        worktree:dir1,dir2        a `git worktree add <path>` whose path is under none of those homes (Bash only)
#        code:dir1,dir2,...        under those top-level folders of the harness repo (code-root pointer)
#        outside-homes             under NONE of the three homes (harness repo, notes, personal code folder). Needs the
#                                  placement_outside_homes switch ON (roundB.conf); {path} in the message = your personal code folder.
#                                  Never fires when that folder does not resolve, or for /tmp-style scratch dirs and ~/.claude, ~/.config.
# Built from: manual THREE HOMES, the desk-building SOP layout, docs/data-layout.md, the where-things-live element.
# Personal override: ~/.config/lifehack/placement.conf (optional, not shipped). Same format; a rule with the
# same name replaces this one; "name<TAB>off" switches a rule off.
code-in-notes	notes	*.sh,*.py	Code lives in a repo, not in your notes folder. Desk code goes in your private repo's desks/<desk>/tools/; harness code goes in the harness repo.
notes-in-harness	code:state,data,memory,records,desks	*.md	Personal notes and records live in your notes folder, not in the harness repo (it is shared with students).
worktree-home	worktree:~/worktrees	*	Git worktrees live in ~/worktrees/<name>/ (or Claude-managed .claude/worktrees/<name>/), never inside a repo or notes folder, and sub-agents must not copy them. Use: git worktree add ~/worktrees/<name> -b <branch>.
code-outside-homes	outside-homes	*.sh,*.py	this belongs in your personal code folder: {path}
