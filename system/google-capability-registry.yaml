# google-capability-registry.yaml
# Authoritative machine-readable registry for all Google Workspace capabilities in this system.
# This is the policy source. The .md companion (system/google-policy.md) is a human-readable
# rendering of it — do not treat the two as independent; edit here first.
#
# PORTED (T9.7c, 2026-08-15) from claudeops-config, where this file existed but never shipped to
# this repo. Generalized: no multi-desk registry (this product has one operator, not several
# named desks each with their own access model — see the note where that section used to be,
# below), no hardcoded personal calendar/label ids. Not machine-parsed anywhere in this repo
# (checked: no .py/.sh reads this file) — it is reference documentation, same status as the
# donor's own "policy source" framing, just not literally consumed by code either place.
#
# Enforcement posture: convention-based (test suite + agent context) for most rows below.
# There is no runtime block for most capabilities. Agents follow policy because it is in their
# loaded context — EXCEPT calendar writes and gws auth/logout, which ARE hook-enforced in this
# repo (system/hooks/guard_calendar_writes.sh, system/hooks/guard_gws_logout.sh).

meta:
  version: "1.0"
  gws_version: "0.22.3"
  binary: "resolved via PATH (shutil.which), falling back to /opt/homebrew/bin/gws or /usr/local/bin/gws — see system/gws-contract.md#binary"
  created_at: "2026-03-27"
  contract_file: "system/gws-contract.md"

risk_classes:
  READ: "Fetches data, no side effects. No confirmation required."
  WRITE_SAFE: "Creates or modifies data, reversible. Show before execute."
  WRITE_DESTRUCTIVE: "Deletes, archives, bulk overwrites. Explicit per-operation confirm."
  ADMIN: "Changes structure, permissions, or sharing. Explicit confirm required."
  AUTOMATION: "Apps Script execution or triggers. Side effects unknown. Explicit confirm + function review."

tiers:
  STABLE: "Live-validated gws Bash support. Contract examples verified. Safe to use."
  VERIFY-BEFORE-USE: "Schema accessible but requires individual live verification before wiring to any skill. Do not treat as available until global_reachability is populated."

# Full policy document: system/google-policy.md
# That document is the authoritative source for prohibitions, guards, and access model.
# This section summarizes the hard-blocked capability IDs for test-suite reference.

global_deny:
  # Email
  - gmail.batch_ops           # Bulk ops — no scope filter exists
  - gmail.send                # No agent sends email (not in registry; hard-blocked at policy level)
  - gmail.draft               # No draft creation
  - gmail.reply               # No reply/forward
  - gmail.label_manage        # No restructuring inbox routing
  - gmail.filter_manage       # No filter creation/modification
  - gmail.delete              # No deleting/trashing messages (not in registry; hard-blocked)

  # Calendar
  - calendar.update_event     # No modifying any event on any calendar
  # calendar.delete_event is restricted to the ONE configured agent calendar only — see
  # google-policy.md prohibition #9. It is NOT globally denied, but is hook-restricted
  # (system/hooks/guard_calendar_writes.sh) to whatever calendar id <notes>/config/cal.md names.

  # Drive
  - drive.delete_file         # Not in capability registry; hard-blocked
  - drive.share_file          # No permission changes without explicit instruction
  - drive.manage_permissions  # No permission changes without explicit instruction
  - drive.public_link         # No "anyone with link" share creation (not in registry; hard-blocked)

  # Sheets
  - sheets.row_delete         # No row/column/tab deletion (not in registry; hard-blocked)
  - sheets.formula_injection  # No = @ + - prefixed values in writes (enforced at write guard)

  # Apps Script
  - apps_script.edit_code     # No code creation or editing
  - apps_script.manage_triggers  # No trigger creation or management

  # People / Contacts
  - people.all                # Google Contacts — nothing here has access

  # System self-modification
  - self.expand_powers        # No agent may write new skills, policies, or capability grants
  - self.change_toolplane     # No agent may modify the gws connection layer, auth, or binary

# ─── Access model (was: Desk Registry) ────────────────────────────────────────
# The donor tracked one access-model row per named workflow persona, each with its own
# email_ingest_scope. This product has no multi-desk model — one operator, one session
# identity — so there is nothing to enumerate here. The single access model for this whole
# repo is stated once, in CLAUDE.md and in the rows below: BROAD read access, WRITE_SAFE with
# confirmation guards, guarded rows require explicit show-before-execute. Email ingest scope
# (which labels get pulled) is whatever the person's own ingest tooling is configured to read
# — not a permission boundary either place, donor or here (see google-policy.md item 4: the
# sanitizer is the wall, not which caller is asking).

