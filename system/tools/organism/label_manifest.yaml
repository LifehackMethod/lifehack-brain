        payload: {tool_name: Bash, tool_input: {command: 'gws gmail users drafts send --id r123'}}
      - desc: the plus-form helper — the shape that walked through a sibling rail's allowlist
        payload: {tool_name: Bash, tool_input: {command: 'gws gmail +send --to nobody@example.com --subject hi'}}
