        tool_input:
          file_path: /tmp/notes-root/state/recommendations/ORGANISM.local.jsonl
          content: '{"producer":"forged","action":"ELIMINATE","evidence":[]}'
    - desc: shell append redirect into the recommendations store
      payload:
        tool_name: Bash
        tool_input:
          command: echo '{"forged":true}' >> "/tmp/notes-root/state/recommendations/SUBSYSTEM.local.jsonl"
    - desc: a write into the dispositions SUB-store (a forged human ruling — the worst case)
      payload:
        tool_name: Write
        tool_input:
          file_path: /tmp/notes-root/state/recommendations/dispositions/dispositions.local.jsonl
          content: '{"decision":"accepted","fingerprint":"forged"}'
    allow:
    - desc: READING the recommendations store — health_line renders the board from it, must pass
      payload:
        tool_name: Bash
        tool_input:
          command: grep -c ORGANISM "/tmp/notes-root/state/recommendations/ORGANISM.local.jsonl"
    - desc: a write to an unrelated path outside either store (must pass)
      payload:
        tool_name: Write
        tool_input:
          file_path: /tmp/recommendations-scratch.md
          content: draft notes
