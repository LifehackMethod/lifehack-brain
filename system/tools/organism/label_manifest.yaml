# label_manifest.yaml — the guards this repo's hook layer claims are enforced, + how to
# FIRE-TEST each one. Read by label_checker.py (organism-audit Feature 1.5).
#
# PORTED 2026-08-14 from claudeops-config's system/tools/organism/label_manifest.yaml. This is
# NOT a straight copy — every entry was checked against THIS repo's ACTUAL system/hooks/ scripts
# (not assumed from the donor's names), because several hooks were renamed or rewritten with
# different scope during their own port. See "WHAT CHANGED IN THIS PORT" below before trusting
# any single row; the working assumption for every future edit is the same one that assumption
# violated: *presence of a same-named script is not proof it does the same thing.*
#
# Each guard declares: what the map CLAIMS (label_claim), the git-tracked script, the
# (event, matcher) rows it must occupy in settings.json, synthetic VIOLATIONS that must
# block (exit 2 or an honored decision:block form), and optional ALLOW cases that must pass
# (exit 0 — proves it discriminates instead of fail-closing on everything).
#
# Payloads are the EXACT JSON Claude Code puts on a hook's stdin. `~`, `$HOME` and `$REPO`
# expand (label_checker.py exports `REPO` into the environment at import time — see that
# module's docstring — so a payload can point INSIDE this checkout without hardcoding a clone
# folder name; the donor manifest assumed the clone always sat at `$HOME/claudeops-config`,
# which is a personal, single-machine assumption this product cannot make).
#
# Violations are INERT — the gate blocks before anything runs, so firing is side-effect-free.
#
# This file is the checker's ground-truth; it is itself an attack surface ~~guarded by
# `guard_write_paths.sh` (see that guard's own entry below)~~. Grow it one proven element at a time.
#
# ⚠ CORRECTED 2026-08-15 — THE STRUCK CLAIM WAS FALSE, AND IT IS AN INSTANCE OF THE VERY DEFECT
#   CLASS THIS FILE EXISTS TO CATCH (house rule `T9.11b`: a documented protection that does not
#   exist is worse than an admitted gap, because the map then reports it green).
#   `guard_write_paths.sh` guards exactly three things — read its own `case` block, and its
#   closing line, which is explicit: "Everything else is allowed. That is deliberate."
#     (a) `$REPO/system/hooks/*`  — with `$REPO/system/hooks/tests/*` deliberately exempted first
#     (b) `$REPO/.claude/settings.json` and `$REPO/.claude/settings.local.json`
#     (c) `$REPO/.git/*`
#   `system/tools/organism/` is not on that list. NOTHING at the hook layer guards this manifest.
#   ⭐ THE PROOF IS IN THIS FILE. The `write-paths-hooks-guard` row below carries an allow-case
#   that writes to `$REPO/system/tools/organism/scratch-probe.md` and asserts it MUST PASS
#   (exit 0). The fire-test that grades that guard LIVE is the same test that demonstrates this
#   directory is wide open — the claim above was refuted 300 lines below it, in this file.
#   ⚠ `guard_organism_map.sh` does not cover it either: it fires on `system/organism/manual.md`,
#   `map-format-specs.md` and `system/organism/elements/*.md` — a different directory, Write only.
#
#   WHAT ACTUALLY PROTECTS THIS FILE, stated in full:
#     · it is git-tracked, so a change shows up in `git diff` and in review. Review is a human,
#       not a control, and that is the whole of the deterrent.
#     · `label_checker.py` FIRES every row against the real script, so this manifest cannot be
#       edited to INVENT a protection: a row claiming LIVE for a script that does not block is
#       computed lower and reported as a DOWNGRADE, and the checker exits non-zero.
#     · what nothing catches — the live, unmitigated exposure: DELETING a row (the guard silently
#       stops being checked, and no count anywhere notices it went missing), or weakening a
#       `violations:` payload so a real guard's blind spot is never fired at.
#   ⚖ This gap is recorded CORRECTLY elsewhere in the shipped tree — `system/organism/manual.md`
#     (label-checker entry: "gap because label_manifest.yaml is unguarded (Feature 1.6 not yet
#     built)") and `system/organism/elements/label-checker.md` (`gap_disposition_note`: "C5
#     unguarded ground truth"). This header was the ONE place in the repo claiming otherwise. It
#     was the outlier; those were right.
#   ⛔ NO GUARD WAS BUILT BY THE SESSION THAT WROTE THIS NOTE, deliberately. Whether the ground
#     truth of the honesty checker deserves its own hook is an OWNER decision — it is already
#     tracked as Feature 1.6 — and a session does not get to add a third part that watches the
#     other two on its own judgment. This edit makes the file TRUE; it does not close the gap.
#
# ══════════════════════════════════════════════════════════════════════════════════════════
# WHAT CHANGED IN THIS PORT — READ BEFORE ADDING OR TRUSTING A ROW
# ══════════════════════════════════════════════════════════════════════════════════════════
#
# ⛔ ~~THREE~~ TWO DONOR GUARDS DO NOT EXIST HERE AND STRUCTURALLY CANNOT — their rows are DROPPED,
#    not carried over as a permanently-red TARGET (a TARGET label means "declared intent, not
#    built yet"; these were never going to be built here, which is a different claim and
#    deserves a different word — an absence, framed):
#      · ✅ RESOLVED 2026-08-15 — `guard_organism_map.sh` IS NOW PORTED, REGISTERED AND FIRE-TESTED.
#        Its row is LIVE below (`organism-map-write-guard`); it is no longer a dropped guard, and
#        the count on the line above went from three to two. The history is kept rather than
#        overwritten, because the SHAPE of this mistake is the reusable part:
#        ~~`guard_organism_map.sh` (donor: "organism-map-write-guard") — protects
#        `system/organism/manual.md` / `system/organism/map-format-specs.md`, which are part of
#        the donor's own self-documentation apparatus. `system/organism/` does not exist in
#        this repo at all (confirmed absent) — same exclusion class as `organism-health.py`.~~
#        ⚠ CORRECTED 2026-08-15 (an earlier lane) — THE STRUCK SENTENCE WAS FALSE, AND IT WAS THIS
#        ROW'S ONLY STATED JUSTIFICATION. Phase 9 ported the organism tree into this repo:
#        `system/organism/` now holds `manual.md` (1206 lines), `map-format-specs.md`, and 42 files
#        under `system/organism/elements/`. It was true when written (pre-Phase-9); it is not now.
#        ⚖ That correction deliberately left the ruling unreversed and asked for a human decision.
#        ⭐ THE DECISION CAME BACK, and it is the standing ruling that already covered this case:
#        *"Unbuilt work still ships. Belongs-but-broken MIGRATES with a debt note. EXCLUDE only if
#        it genuinely doesn't belong."* It belongs — its SUBJECT is now here. The surviving
#        independent argument ("it is the donor's own self-documentation apparatus") did not hold
#        once the apparatus itself shipped: the map is this repo's now, and so is guarding it.
#        ⛔ THE STATE THIS RESOLVED WAS THE WORST OF THE THREE AVAILABLE ONES. Between the port and
#        this fix, SIX shipped files described the organism tree as write-guarded while NOTHING
#        guarded it: `manual.md` (4 occurrences) and 5 `elements/*.md` — archivist,
#        claude-md-pyramid, hook-plane, label-checker, pulse-cron. (Counted with grep, not by
#        hand; a hand-typed denominator is one of the six failures `T9.11b` was ratified over.)
#        `map-format-specs.md` §6.4 is NOT in that six: it described the guarantee and then said
#        plainly it was unenforced here, which is the reason the gap was findable at all.
#        A protection that is documented but absent is worse than an admitted gap, because the map
#        reports it green — that is the defect class house rule `T9.11b`
#        (`system/build-rules-index.md`) is named for, and this row is now one of its instances.
#      · `guard_router_writes.sh` (donor: "router-write-guard") — protects a home-mesh-router
#        write surface reachable only through `desks/dobby/tools/asus_mesh_read.py`. Dobby is
#        an excluded personal desk (the Desk Ruling, 2026-08-14); its tool tree does not ship.
#      · `guard_hook_sop_read.sh` (donor: "hook-sop-read-gate") — verified absent from this
#        repo and CORRECTLY so, per this port's own instructions (same exclusion class as
#        `architecture_reason.py` and `auto_register_skill.sh`).
#
# ⚖ TWO GUARDS WERE RENAMED DURING THEIR OWN PORT — updated here to the real filename, found
#    by listing `system/hooks/*.sh` rather than trusting the donor's name:
#      · `block_primary_calendar.sh` -> `guard_calendar_writes.sh`
#      · (gmail) see the next block — this one is not a rename, it is a DIFFERENT GUARD.
#
# ⛔⛔ THE GMAIL GUARD IS NOT A RENAME — IT IS A DIFFERENT PROTECTION. The donor's
#    `guard_gmail_send.sh` (blocks `send`/`+send`, allows `drafts create`/`modify` — the operator's
#    "DRAFT yes, SEND no" ruling) does not exist here. What ships instead is
#    `guard_gmail_destructive.sh`, which blocks `delete`/`batchDelete`/`trash` and allows
#    `modify`/`untrash`/every read — a DIFFERENT irreversible act (destroying mail, not sending
#    it). Read that guard's own header before assuming otherwise. ⇒ this manifest carries BOTH
#    concepts under their own honest ids: `gmail-destructive-guard` (real, tests the guard that
#    actually ships) and ~~NO `gmail-send-guard` row at all — inventing one against a script that
#    is not here would silently compute TARGET and imply "not built yet" for something that was
#    never even attempted in this port. **FLAG FOR THE LEAD, not fixed here (system/hooks/ is
#    out of this task's file list): a fresh install currently has NO guard preventing an agent
#    from sending mail** — only from deleting it. If "DRAFT yes, SEND no" is meant to hold here
#    too, that is a new hook to write, not a manifest row to add.~~
#    ⇒ ✅ RESOLVED 2026-08-15. THE FLAG WAS ACTED ON: `system/hooks/guard_gmail_send.sh` is now
#    WRITTEN, REGISTERED (PreToolUse/Bash) and FIRE-TESTED here, so the `gmail-send-guard` row
#    below is a real row against a real script, not an invented one. The struck text is kept
#    rather than deleted because it is the record of how the gap was found and how long it stood.
#    The two gmail guards remain SEPARATE and neither is a rename of the other: one refuses to
#    DESTROY mail, the other refuses to post it outward, and each owns exactly one irreversible act.
#
# ⚖ `write-path-residency-guard` WAS RE-SCOPED, NOT JUST RE-PATHED. The donor guard fired on
#    "did this write land in an approved zone" (Drive spine or git clone — the two-machine
#    model this product does not have). `guard_write_paths.sh` in THIS repo is a different,
#    narrower control: it blocks a Write/Edit aimed at a hook script or at
#    `.claude/settings.json`/`settings.local.json` (the enforcement layer protecting itself),
#    and otherwise allows everything — read that script's own header (`SCOPE` note) before
#    "restoring" the donor's broader test. Renamed here to `write-paths-hooks-guard` so the id
#    does not keep claiming a residency check that is not what this script does; the payloads
#    below test what it ACTUALLY does.
#
# ⚖ `guard_tasks_writes.sh` and `guard_calendar_writes.sh` ARE BOTH CONFIG-DRIVEN NOW — neither
#    hardcodes a calendar id or a Tasks list id; both read `<notes>/config/` at fire time
#    (`shared/cal_config.py`). ⇒ **on a fresh install with nothing configured yet, the
#    allow-cases that depend on "the configured calendar/list" cannot be fixture-tested
#    generically** (there is no real id to put in this file, and putting a real one would be
#    exactly the identifier-in-the-repo mistake this port's own contract forbids). The
#    write-side allow-cases for both guards are DROPPED for this reason; the read-side
#    allow-cases (which do not depend on configuration) are kept. **This means a bare
#    `label_checker.py check` on a fresh clone will legitimately show these two guards PARTIAL
#    until `<notes>/config/` is populated — that is the fixture's honest limit, not a bug in
#    the guard or the checker.**
#
# ⚖ ENV VAR RENAME, applied wherever it appeared in a payload: `CLAUDEOPS_SKIP_*` ->
#    `LIFEHACK_SKIP_*` (ingest_gate_enforce.sh); `CLAUDEOPS_SHEET_CONFIRM` ->
#    `LIFEHACK_SHEET_CONFIRM` (both sheet guards). `CLAUDEOPS_DRIVE`-style Drive paths were
#    replaced with synthetic `/tmp/...` paths carrying the same matched PATH SEGMENT
#    (`state/findings/`, `state/debt-ledger.md`, `canon/`) — every guard tested below matches
#    on a path SUFFIX/SEGMENT, never a root-anchored absolute path, so a synthetic root proves
#    the same thing a real Drive path would without needing this repo's data root resolved (or
#    even configured) to run the fire test.
#
# ⚖ SKILLS MOVED. The donor's skills lived at `skills/<name>/SKILL.md`; this repo's skill
#    harness reads them from `.claude/skills/<name>/SKILL.md` (confirmed: every shipped
#    SKILL.md here is under `.claude/skills/`). Every skill-path payload below was updated to
#    match. The Edit-simulation cases (`enforce_skill_frontmatter.sh` reads the file off disk to
#    compute the RESULTING content) now point at `.claude/skills/save/SKILL.md`, which is real
#    and git-tracked in this repo — confirmed to exist and carry a `description:` line.
#
# ── SEAM: the skill-factory's fail-fixtures are a DELIBERATE parallel, not a duplicate ──
# `system/parts/fail-fixtures/*.json` mirror this file's violations/allow SHAPE on purpose —
# same idea, prove a check by watching it FAIL. They stay in a SEPARATE file (see the donor's
# own note, reproduced in spirit): label_checker.fire() runs `bash <script>` and delivers the
# payload as faithful JSON on STDIN, judged via block_verdict; factory parts take ARGV FLAGS
# and refuse with exit 1 — a structurally different execution contract. Do not consolidate them.

guards:
  # ── ELEMENT: security / ingest gate ───────────────────────────────────────
  # The unified on-path gate over every external-read channel (WebFetch, WebSearch,
  # doc/external-file Reads, gws gmail/calendar/tasks/drive, the SKIP bypass, the reader-actor
  # scratch lock). Deny = JSON on stderr + exit 2; clean call = exit 0.
  - id: security-ingest-gate
    label_claim: LIVE
    script: system/hooks/ingest_gate_enforce.sh
    expect_block_exit: 2
    registered:
      - {event: PreToolUse, matcher: WebFetch}
      - {event: PreToolUse, matcher: WebSearch}
      - {event: PreToolUse, matcher: Read}
      - {event: PreToolUse, matcher: Bash}
    violations:
      - desc: raw WebFetch (unsanitized HTML into context)
        payload: {tool_name: WebFetch, tool_input: {url: "http://example.com/x"}}
      - desc: native WebSearch (unsanitized snippets)
        payload: {tool_name: WebSearch, tool_input: {query: "anything"}}
      - desc: Read of an external .pdf (white-font injection)
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/evil.pdf"}}
      - desc: Read of an external .md OUTSIDE the trusted zone
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/attacker-note.md"}}
      - desc: Bash setting a LIFEHACK_SKIP_* sanitizer bypass
        payload: {tool_name: Bash, tool_input: {command: "export LIFEHACK_SKIP_SAFE_FETCH=1"}}
      - desc: main-session read of sanitized ingest scratch (reader-actor lock)
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/rdr/bundle.txt"}}
      - desc: raw gws email BODY read (format:full) — the #1 injection channel
        payload: {tool_name: Bash, tool_input: {command: 'gws gmail users messages get --params {"format":"full"}'}}
      - desc: raw gws calendar read (reader-actor channel)
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar events list --params x'}}
      - desc: raw gws tasks read (reader-actor channel)
        payload: {tool_name: Bash, tool_input: {command: 'gws tasks tasks list --params x'}}
      - desc: external .txt OUTSIDE the trusted zone
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/x.txt"}}
      - desc: Read of an external .docx (hidden w:vanish runs)
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/evil.docx"}}
      - desc: Read of an external .xlsx (hidden sheets/rows, formula injection)
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/evil.xlsx"}}
      - desc: Read of an external .csv (formula-injection cells)
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/evil.csv"}}
      - desc: raw Gmail body read via the "read" alias (a different regex branch than the
          format:full .get case above — messages/threads .read, not .get)
        payload: {tool_name: Bash, tool_input: {command: "gws gmail messages read 18abc"}}
      - desc: Read of an external file with an unrecognised extension (fail-safe default —
          an unrecognised type outside the trusted zone is UNKNOWN, not safe)
        payload: {tool_name: Read, tool_input: {file_path: "/tmp/attacker-note.eml"}}
      - desc: unparseable stdin must fail CLOSED (never allow-on-parse-error)
        raw_stdin: "not json at all"
    allow:
      - desc: Read of an INTERNAL .md inside the clone (trusted zone)
        payload: {tool_name: Read, tool_input: {file_path: "$REPO/README.md"}}
      - desc: Bash gmail LIST (not a body read — must not trip the read/get body checks)
        payload: {tool_name: Bash, tool_input: {command: "gws gmail messages list --maxResults 1"}}
      - desc: Bash calendar read routed through safe_calendar.py (the sanctioned path)
        payload: {tool_name: Bash, tool_input: {command: "python3 system/tools/safe_calendar.py --desk cal {}"}}
      - desc: Bash email body read routed through email_convert.py (the sanctioned path)
        payload: {tool_name: Bash, tool_input: {command: "python3 shared/tools/email_convert.py --threads X"}}
      - desc: a benign Bash command
        payload: {tool_name: Bash, tool_input: {command: "ls -la"}}
      - desc: a benign Read of a code file inside the trusted zone
        payload: {tool_name: Read, tool_input: {file_path: "$REPO/.claude/settings.json"}}

  # ── ELEMENT: archivist / hook-plane (the self-schematic map) ──────────────
  # ══ ~~organism-map-write-guard: DROPPED — the guard was never built here and there is nothing
  # to fire-test.~~ ⇒ ✅ PORTED, REGISTERED AND FIRE-TESTED 2026-08-15. The row is LIVE below.
  # The struck text is kept, not deleted, because it is the record of how the gap happened: the
  # drop rested solely on "system/organism/ does not exist in this repo", Phase 9 landed that tree
  # the same day, and the dead premise then held a guard out of a repo whose own shipped docs said
  # it was guarded. Full history in the "WHAT CHANGED" block above.
  #
  # ⚠ EXPECT `PARTIAL`, NOT `LIVE`, UNTIL THIS LANE'S COMMIT LANDS — and that is CORRECT, not a
  # defect. `check` requires the script to be git-tracked (a guard that cannot travel to another
  # machine is not enforced there), and this lane is not permitted to run `git add`. The single
  # reason printed will be "script is NOT git-tracked". It flips to LIVE on the first commit that
  # includes system/hooks/guard_organism_map.sh — nothing else is outstanding. Everything else was
  # verified this date: registered under PreToolUse/matcher:"Write", fired through a REAL session
  # launched from this repo (deny text reached the model in full), surgical Edit ALLOWED in the
  # same run, unrelated Write untouched, and all 25 cases in
  # system/hooks/tests/test_organism_map_guard.sh green.
  - id: organism-map-write-guard
    label_claim: LIVE
    script: system/hooks/guard_organism_map.sh
    registered:
      - {event: PreToolUse, matcher: Write}
    violations:
      - desc: wholesale Write of the reference index (manual.md)
        payload: {tool_name: Write, tool_input: {file_path: "$REPO/system/organism/manual.md", content: "clobbered"}}
      - desc: wholesale Write of the label-criteria file (map-format-specs.md)
        payload: {tool_name: Write, tool_input: {file_path: "$REPO/system/organism/map-format-specs.md", content: "clobbered"}}
      - desc: wholesale Write of an elements/ encyclopedia file — the unguarded 96% in the
          donor's original scope, in scope here from the first line
        payload: {tool_name: Write, tool_input: {file_path: "$REPO/system/organism/elements/hook-plane.md", content: "clobbered"}}
      - desc: THE SPELLING THE DONOR MISSED — a plain RELATIVE path. The donor matched a raw glob
          ("*/system/organism/manual.md") against file_path, which a relative path walks straight
          past; this port resolves realpath against the repo root first.
        payload: {tool_name: Write, tool_input: {file_path: "system/organism/manual.md", content: "clobbered"}}
      - desc: the same file named through a .. traversal
        payload: {tool_name: Write, tool_input: {file_path: "$REPO/system/tools/../organism/manual.md", content: "clobbered"}}
      - desc: unparseable stdin must fail CLOSED (never allow-on-parse-error)
        raw_stdin: "not json at all"
    allow:
      - desc: ⭐ THE REDIRECT ITSELF — a surgical Edit of the manual is the normal authoring path
          and must never be blocked. A guard that blocks ordinary work gets unregistered.
        payload: {tool_name: Edit, tool_input: {file_path: "$REPO/system/organism/manual.md", old_string: "a", new_string: "b"}}
      - desc: a surgical Edit of an element file (the element-backfill path)
        payload: {tool_name: Edit, tool_input: {file_path: "$REPO/system/organism/elements/canon.md", old_string: "a", new_string: "b"}}
      - desc: an ordinary Write elsewhere in the repo (proves it discriminates by subject rather
          than blanket-denying the Write tool)
        payload: {tool_name: Write, tool_input: {file_path: "$REPO/README.md", content: "x"}}
      - desc: a non-.md file inside elements/ — the scope is the encyclopedia, not the directory
        payload: {tool_name: Write, tool_input: {file_path: "$REPO/system/organism/elements/notes.txt", content: "x"}}
      - desc: another checkout's organism tree — this guard is anchored to THIS repo root and must
          not reach across into a different clone (the donor's unanchored glob did)
        payload: {tool_name: Write, tool_input: {file_path: "/tmp/some-other-repo/system/organism/manual.md", content: "x"}}

  # ── ELEMENT: gws-plane (auth half) ────────────────────────────────────────
  # The single most destructive command in the system: a logout destroys credentials for
  # every window and every desk at once.
  - id: gws-auth-logout-guard
    label_claim: LIVE
    script: system/hooks/guard_gws_logout.sh
    registered:
      - {event: PreToolUse, matcher: Bash}
    violations:
      - desc: gws auth logout (destroys creds for every window + desk)
        payload: {tool_name: Bash, tool_input: {command: 'gws auth logout'}}
    allow:
      - desc: an ordinary gws read (proves it discriminates, not blanket-denies gws)
        payload: {tool_name: Bash, tool_input: {command: 'gws gmail labels list'}}

  # ── ELEMENT: gws-plane (calendar half) ────────────────────────────────────
  # Hook-enforced rail: every calendar write targets the configured writable calendar
  # (`<notes>/config/cal.md`, read at fire time by shared/cal_config.py), never `primary`.
  # ⚠ On a fresh, unconfigured install the guard refuses EVERY write (there is nowhere safe
  # to send it) — so only the DENY-side of this guard is fixture-testable generically; see
  # "WHAT CHANGED" above for why the write-allow cases are not carried over.
  - id: calendar-primary-write-guard
    label_claim: LIVE
    script: system/hooks/guard_calendar_writes.sh
    registered:
      - {event: PreToolUse, matcher: Bash}
    violations:
      - desc: event insert targeting the PRIMARY calendar
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar events insert --calendar primary --summary x'}}
      - desc: THE BYPASS — gws own +insert helper targeting PRIMARY
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar +insert --calendar primary --summary x'}}
      - desc: event DELETE on PRIMARY (verb was never in an old allowlist)
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar events delete --calendar primary --id abc'}}
      - desc: calendars CLEAR on PRIMARY — wipes an entire calendar
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar calendars clear --calendar primary'}}
      - desc: acl insert on PRIMARY (unlisted noun — proves default-deny, not verb-matching)
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar acl insert --calendar primary'}}
      - desc: payload spoof — a WRITE whose --params body contains a read phrase
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar +insert --params ''{"x":"events list"}'''}}
    allow:
      # Write-allow cases dropped (see "WHAT CHANGED" above — no real configured calendar id
      # can live in this file). Only the config-independent READ allow-cases remain.
      - desc: READ of the calendar (regression — must not be blocked; reads pass on any list)
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar events list --max 5'}}
      - desc: READ calendarList (regression — must not be blocked)
        payload: {tool_name: Bash, tool_input: {command: 'gws calendar calendarList list'}}

  # ── ELEMENT: gws-plane (gmail destructive-verb half) ──────────────────────
  # NOT the donor's send-guard — see "THE GMAIL GUARD IS NOT A RENAME" above. This blocks
  # delete/batchDelete/trash (irreversible) and allows modify (label moves)/untrash/reads.
  - id: gmail-destructive-guard
    label_claim: LIVE
    script: system/hooks/guard_gmail_destructive.sh
    expect_block_exit: 2
    registered:
      - {event: PreToolUse, matcher: Bash}
    violations:
      - desc: threads trash (irreversible; the guard's own named example)
        payload: {tool_name: Bash, tool_input: {command: 'gws gmail users threads trash --user-id me --id 18abc'}}
      - desc: messages delete
