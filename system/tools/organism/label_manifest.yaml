  # Ported 2026-08-15 to close the gap this file's own header flagged. DRAFT yes, outbound no:
  # it refuses the messages/drafts outbound verb and the +helper form, DEFAULT-DENIES an
  # unrecognised gmail operation, and leaves every read and the whole drafting path alone.
